services:
  - type: web
    name: plant-co2-backend
    runtime: python
    pythonVersion: "3.11.9"
    plan: free
    region: oregon
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: FRONTEND_URL
        value: https://your-vercel-app.vercel.app
      - key: FIREBASE_PROJECT_ID
        value: plant-co2-farm
      - key: GCP_PROJECT_ID
        value: plant-co2-farm
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        value: orders@plant-co2-farm.com
    healthCheckPath: /health
    autoDeploy: true